services:
  gateway:
    image: nginx:alpine
    container_name: schedule-gateway
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: schedule-backend-dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8000
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=db_edt_p;User=root;Password=root;
      - Cors__Origins=http://localhost
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: schedule-frontend-dev
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=/api
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    container_name: schedule-mysql
    restart: always
    environment:
      MYSQL_DATABASE: db_edt_p
      MYSQL_USER: orion
      MYSQL_PASSWORD: orion3691
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
