version: "3.9"

services:
  backend:
    build: ./backend
    container_name: schedule-backend
    ports:
      - "8000:8000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

  frontend:
    build: ./frontend
    container_name: schedule-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
