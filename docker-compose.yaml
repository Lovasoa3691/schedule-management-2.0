services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: schedule-backend-dev
    ports:
      - "8000:8000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8000
      - ConnectionStrings__DefaultConnection=Server=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};User=${DB_USER};Password=${DB_PASSWORD};SslMode=Required;

  frontend:
    build: ./frontend
    container_name: schedule-frontend-dev
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=development
    depends_on:
      - backend
